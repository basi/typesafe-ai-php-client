name: Spec drift check

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check for OpenAPI spec drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the current OpenAPI spec
        run: tools/fetch-spec.sh spec

      - name: Check for a diff
        id: diff
        run: |
          if git diff --quiet -- spec/; then
            echo "No drift detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "diffstat<<DIFFSTAT_EOF"
            git diff --stat -- spec/
            echo "DIFFSTAT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update OpenAPI snapshot"
          title: "chore: update OpenAPI snapshot"
          branch: spec-drift/update
          add-paths: spec/
          body: |
            The live typesafe.ai OpenAPI spec has drifted from the committed snapshot in `spec/`:

            ```
            ${{ steps.diff.outputs.diffstat }}
            ```

            Before merging, check whether this needs:

            - [ ] Updated request/response DTOs (`src/Request/`, `src/Response/`)
            - [ ] Updated or new tests (`tests/Unit/`, `tests/Contract/`)
            - [ ] An update to `docs/parity.md`
