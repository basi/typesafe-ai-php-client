name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "PHP ${{ matrix.php }} (${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['locked-or-highest', 'lowest']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        # Run all checks and report intentional exact-version warnings without failing CI.
        run: composer validate

      - name: Locate Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.dependencies }}-

      # composer.lock is intentionally not committed for this library (see .gitignore), so
      # "locked-or-highest" uses it when present and otherwise falls back to the highest versions
      # allowed by composer.json.
      - name: Install dependencies (locked-or-highest)
        if: matrix.dependencies == 'locked-or-highest'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Check coding standard
        run: composer cs
